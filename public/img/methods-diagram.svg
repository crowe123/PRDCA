<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Partial fill-in compared with full removal</title>
  <desc id="d">Left: a partial fill-in leaves the pool shell in the ground with the top two feet of wall removed and drainage holes broken through the bottom, then fill on top; the area is limited to landscaping. Right: a full removal takes out the whole shell and replaces it with fill compacted in layers to 90 percent and certified by an engineer; the area can be built on.</desc>
  <rect width="960" height="380" fill="#f6f8f7"/>
  <!-- Partial -->
  <text x="240" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12372a">Partial fill-in</text>
  <rect x="40" y="70" width="400" height="16" fill="#6fae5c"/>
  <rect x="40" y="86" width="400" height="214" fill="#c9a77c"/>
  <path d="M100 120 L100 250 Q100 270 120 270 L360 270 Q380 270 380 250 L380 120" fill="#d8c3a0" stroke="#7d7d7d" stroke-width="10"/>
  <line x1="100" y1="86" x2="100" y2="120" stroke="#b33" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="380" y1="86" x2="380" y2="120" stroke="#b33" stroke-width="3" stroke-dasharray="6 5"/>
  <g fill="#f6f8f7"><rect x="150" y="265" width="24" height="10"/><rect x="230" y="265" width="24" height="10"/><rect x="310" y="265" width="24" height="10"/></g>
  <g fill="#2a6fdb"><path d="M162 280 l-6 14 h12z"/><path d="M242 280 l-6 14 h12z"/><path d="M322 280 l-6 14 h12z"/></g>
  <text x="240" y="186" text-anchor="middle" font-size="15" fill="#3d2c14">Shell stays, filled with soil</text>
  <text x="240" y="108" text-anchor="middle" font-size="13" fill="#b33">Top of wall removed (often 12 in. to 2 ft)</text>
  <text x="240" y="326" text-anchor="middle" font-size="14" fill="#12372a">Drainage holes broken through the bottom</text>
  <text x="240" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#12372a">Landscaping use only</text>
  <!-- Full -->
  <text x="720" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12372a">Full removal</text>
  <rect x="520" y="70" width="400" height="16" fill="#6fae5c"/>
  <rect x="520" y="86" width="400" height="214" fill="#c9a77c"/>
  <g stroke="#a68457" stroke-width="2">
    <line x1="580" y1="130" x2="860" y2="130"/><line x1="580" y1="160" x2="860" y2="160"/><line x1="580" y1="190" x2="860" y2="190"/><line x1="580" y1="220" x2="860" y2="220"/><line x1="580" y1="250" x2="860" y2="250"/>
  </g>
  <path d="M580 100 L580 250 Q580 270 600 270 L840 270 Q860 270 860 250 L860 100" fill="none" stroke="#7d7d7d" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="720" y="180" text-anchor="middle" font-size="15" fill="#3d2c14">Shell hauled away</text>
  <text x="720" y="200" text-anchor="middle" font-size="15" fill="#3d2c14">Fill compacted in layers to 90%</text>
  <text x="720" y="326" text-anchor="middle" font-size="14" fill="#12372a">Engineer certifies the compaction</text>
  <text x="720" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#12372a">Can be built on later</text>
</svg>
