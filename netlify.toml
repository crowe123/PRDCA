# The site is generated locally with `python3 build.py`; public/ and data/dashboard.json are committed.
[build]
  command = ""
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The Netlify subdomain must not compete with the live domain in search results:
# send every netlify.app URL to the same path on poolremovaldirectoryca.com.
[[redirects]]
  from = "https://pool-removal-california.netlify.app/*"
  to = "https://poolremovaldirectoryca.com/:splat"
  status = 301
  force = true
